[config.site]
title = "Ahamed Rasel"
description = "Technical writer who thinks like an engineer — turning million-user software into clear docs, and building the AI agents and n8n workflows that keep it accurate."
pageTitle = "Ahamed Rasel — Technical Writer & AI Automation"
pageDescription = "Technical writer who thinks like an engineer — turning million-user software into clear docs, and building the AI agents and n8n workflows that keep it accurate."
repository = "https://github.com/ah-rasel5/portfolio"
