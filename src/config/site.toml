# Site configuration. Every key here is validated by src/content.config.ts and
# read somewhere in src/ — if you add a key, wire it up in both places or the
# build will reject it.

[config.site]
title = "Ahamed Rasel"
description = "Technical writer who thinks like an engineer — turning million-user software into clear docs, and building the AI agents and n8n workflows that keep it accurate."
pageTitle = "Ahamed Rasel — Technical Writer & AI Automation"
pageDescription = "Technical writer who thinks like an engineer — turning million-user software into clear docs, and building the AI agents and n8n workflows that keep it accurate."

[config.profile]
name = "Ahamed Rasel"
handle = "@ah-rasel5"
role = "Senior Technical Writer"
company = "AuthLab · WPManageNinja"
location = "Sylhet, Bangladesh · Remote"
email = "rasel.ahm55@gmail.com"
github = "https://github.com/ah-rasel5"
linkedin = "https://www.linkedin.com/in/md-rasel-ahamed-8a4b72195"
meta = "Docs as a product decision — written sharp, then automated with AI agents & n8n."
# Placeholder monogram mark — swap for a real photo in public/images/
avatar = "/images/avatar-placeholder.svg"

# Code block themes. Read by ec.config.mjs at build time.
[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.home.intro]
title = "I'm Ahamed Rasel"

[config.home]
# Homepage "About" block — one string per paragraph.
about = [
  "I started out writing help articles and kept following the thread — into product decisions, into the systems behind them, and eventually into the code that keeps documentation honest.",
  "Today I run docs for software used by more than a million people, and build the AI agents and n8n workflows that keep a knowledge base that size accurate without a team of ten.",
  "Outside of work I write about docs-as-product, prompt engineering, and the unglamorous automation that actually holds up.",
]

# Right column of the "Experience" section.
skills = [
  "Documentation strategy & information architecture",
  "Developer-facing API and integration docs",
  "Docs-as-code (Git, Markdown, CI review)",
  "AI agent pipelines (Claude, Codex, Google AI Studio)",
  "n8n workflow automation",
  "Knowledge base migration at scale",
  "Editing & style systems",
  "Release notes & changelogs",
]

